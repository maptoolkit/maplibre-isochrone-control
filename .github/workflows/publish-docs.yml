name: Publish Docs

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCS_REPO_TOKEN:
        required: true

jobs:
  publish-docs:
    uses: maptoolkit/.github/.github/workflows/publish-docs.yml@main
    with:
      docs-path: docs/content/plugins/maplibre-isochrone-control.md
      front-matter: |
        title: "Show Travel-Time Areas in MapLibre GL JS"
        linkTitle: "Isochrone Control"
        description: "Let users drag a marker onto a MapLibre GL JS map to show the area reachable within a travel time, with the Maptoolkit Isochrone Control plugin: install, options, custom providers and routing profiles, methods, and styling."
        weight: 50
        libraries: [maplibre]
        tags: [maplibre, controls, isochrone, routing]
    secrets:
      DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
